# MySQL + Qdrant + the nginx web proxy for the self-hosted setup. Started by
# the launcher with `docker compose --env-file ../.env up -d <service>`; values
# come from the generated .env.
# Ports follow DB_BIND_HOST from .env, which the launcher sets to 127.0.0.1:
# nothing outside this computer needs the databases, so they stay off the local
# network even when the dashboard is served to it (important on shared/public
# Wi-Fi). `launch.sh --expose-databases` publishes them on BIND_HOST instead.
name: junction-ai

services:
  mysql:
    # MySQL Community Server is GPLv2. It runs as a separate, unmodified
    # service the app talks to over the network, so it does not affect this
    # project's MIT license. Use an MIT client library (PyMySQL) in app code.
    image: mysql:8.4
    container_name: junction-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run the launcher to generate .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-veritas_lens}
      MYSQL_USER: ${MYSQL_USER:-veritas_lens}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run the launcher to generate .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs only when the data volume is first created. After changing
      # init.sql on an existing install, apply migrations instead (or reset
      # with `docker compose down -v`, which deletes all data).
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: junction-qdrant
    restart: unless-stopped
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${DB_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # The dashboard on the default web port: http://<this computer>/ instead of
  # :8000. Started last by the launcher (`up -d nginx`), once the backend it
  # routes to is answering; `launch.sh --no-proxy` leaves it out.
  nginx:
    image: nginx:1.27-alpine
    container_name: junction-nginx
    restart: unless-stopped
    # How Docker can reach the backend differs per system, so the launcher
    # computes these (local_ai/services.py, _nginx_env):
    #   Linux - the container shares this computer's network, binds
    #     BIND_HOST:HTTP_PORT itself (the ports below are then ignored) and
    #     reaches the backend at 127.0.0.1, even when it listens on loopback
    #     only (--local).
    #   Docker Desktop (macOS/Windows) - no host networking: Docker publishes
    #     the port and host.docker.internal is the way back to the backend.
    network_mode: ${NGINX_NETWORK_MODE:-bridge}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HTTP_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGINX_LISTEN: ${NGINX_LISTEN:-80}
      NGINX_UPSTREAM: ${NGINX_UPSTREAM:-host.docker.internal:8000}
      # The image renders /etc/nginx/templates/*.template with envsubst at
      # startup; this keeps it to the two variables above, so nginx's own
      # variables in the template (host, remote_addr, scheme) stay untouched.
      NGINX_ENVSUBST_FILTER: "^NGINX_(LISTEN|UPSTREAM)"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  mysql_data:
  qdrant_data:

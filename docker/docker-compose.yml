# MySQL + Qdrant for the self-hosted setup. Started by the launcher with
# `docker compose --env-file ../.env up -d`; values come from the generated .env.
# Ports follow DB_BIND_HOST from .env, which the launcher sets to 127.0.0.1:
# nothing outside this computer needs the databases, so they stay off the local
# network even when the dashboard is served to it (important on shared/public
# Wi-Fi). `launch.sh --expose-databases` publishes them on BIND_HOST instead.
name: junction-ai

services:
  mysql:
    # MySQL Community Server is GPLv2. It runs as a separate, unmodified
    # service the app talks to over the network, so it does not affect this
    # project's MIT license. Use an MIT client library (PyMySQL) in app code.
    image: mysql:8.4
    container_name: junction-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run the launcher to generate .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-veritas_lens}
      MYSQL_USER: ${MYSQL_USER:-veritas_lens}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run the launcher to generate .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs only when the data volume is first created. After changing
      # init.sql on an existing install, apply migrations instead (or reset
      # with `docker compose down -v`, which deletes all data).
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: junction-qdrant
    restart: unless-stopped
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${DB_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:

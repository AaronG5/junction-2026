[project]
name = "veritas-lens"
version = "0.1.0"
description = "Veritas Lens: disinformation analysis you can run on your own computer"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
# Not an installable package: uv only manages the environment the launcher
# and (later) the backend run in. Run everything with `uv run ...`.
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
# Starlette suggests the new "httpx2" package for its test client. Not adopted yet:
# it hasn't been reviewed; plain httpx works. Revisit when updating dependencies.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "integration: needs Docker MySQL + Qdrant (skipped automatically when they aren't running)",
    "llm: needs llama-swap running (skipped automatically when it isn't)",
    "scrape: calls Oxylabs / context.dev and uses paid credits; only runs with -m scrape",
]

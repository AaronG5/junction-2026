[project]
name = "veritas-lens"
version = "0.1.0"
description = "Veritas Lens: disinformation analysis you can run on your own computer"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
]

[tool.uv]
# Not an installable package: uv only manages the environment the launcher
# and (later) the backend run in. Run everything with `uv run ...`.
package = false
